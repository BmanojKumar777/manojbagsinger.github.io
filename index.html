:root {
  --bg: #0a0a0a;
  --bg-soft: #121212;
  --bg-card: #181818;
  --bg-glass: rgba(24,24,24,0.7);
  --border: rgba(255,255,255,0.08);
  --border-gold: rgba(255,215,0,0.2);
  --text: #ffffff;
  --text-dim: #a1a1aa;
  --text-muted: #71717a;
  --gold: #FFD700;
  --gold-light: #FFE55C;
  --gold-dark: #C9A900;
  --accent: #FFD700;
  --spotify-green: #1DB954;
  --neon-glow: 0 0 20px rgba(255,215,0,0.3), 0 0 40px rgba(255,215,0,0.15);
}
* {
  font-family: 'Space Grotesk', system-ui, -apple-system, sans-serif;
}
.mono {
  font-family: 'JetBrains Mono', monospace;
}
html {
  scroll-behavior: smooth;
}
body {
  background: var(--bg);
  color: var(--text);
  overflow-x: clip;
}
::-webkit-scrollbar {
  width: 6px;
  height: 6px;
}
::-webkit-scrollbar-track {
  background: var(--bg);
}
::-webkit-scrollbar-thumb {
  background: #2a2a2a;
  border-radius: 10px;
}
::-webkit-scrollbar-thumb:hover {
  background: #3a3a3a;
}
/* Glass */
.glass {
  background: linear-gradient(180deg, rgba(255,255,255,0.06) 0%, rgba(255,255,255,0.02) 100%);
  backdrop-filter: blur(20px) saturate(180%);
  -webkit-backdrop-filter: blur(20px) saturate(180%);
  border: 1px solid var(--border);
}
.glass-gold {
  background: linear-gradient(180deg, rgba(255,215,0,0.08) 0%, rgba(255,215,0,0.02) 100%);
  backdrop-filter: blur(20px);
  border: 1px solid var(--border-gold);
}
/* Glow text */
.glow-gold {
  text-shadow: 0 0 20px rgba(255,215,0,0.5);
}
.glow-border {
  box-shadow: var(--neon-glow);
}
/* Grid lines */
.grid-lines {
  background-image: 
    linear-gradient(rgba(255,255,255,0.02) 1px, transparent 1px),
    linear-gradient(90deg, rgba(255,255,255,0.02) 1px, transparent 1px);
  background-size: 40px 40px;
}
/* Animations */
@keyframes float {
  0%,100% {
    transform: translateY(0)
  }
  50% {
    transform: translateY(-10px)
  }
}
@keyframes pulse-gold {
  0%,100% {
    box-shadow: 0 0 0 0 rgba(255,215,0,0.4)
  }
  50% {
    box-shadow: 0 0 0 12px rgba(255,215,0,0)
  }
}
@keyframes equalizer {
  0%,100% {
    height: 8px
  }
  50% {
    height: 28px
  }
}
